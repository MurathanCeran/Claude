<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#16384f" />
<meta name="description" content="J.A.R.V.I.S — sesli yapay zeka asistanı." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="JARVIS" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>J.A.R.V.I.S</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230b0918'/><circle cx='50' cy='50' r='34' fill='none' stroke='%23a878ff' stroke-width='4'/><circle cx='50' cy='50' r='12' fill='%23a878ff'/></svg>" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='none' stroke='%2356e6ff' stroke-width='6'/><circle cx='50' cy='50' r='18' fill='%2356e6ff'/></svg>" />
<style>
  :root {
    --accent: #56e6ff;        /* anlık duruma göre değişir */
    --accent-soft: #9af0ff;
    --idle: #4f7f95;
    --gold: #ffd166;
    --purple: #b48bff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    /* Higgsfield tarzı derin mor uzay zemini */
    background: radial-gradient(circle at 50% 40%, #2c1d52 0%, #1a1338 45%, #0b0918 100%);
    color: #eaf7ff;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition: background 0.8s ease;
  }
  /* hafif ızgara dokusu */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(120,200,230,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,200,230,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
  }
  body.speaking { background: radial-gradient(circle at 50% 40%, #3a2f1a 0%, #221a33 45%, #0b0918 100%); }
  body.thinking { background: radial-gradient(circle at 50% 40%, #3a256a 0%, #1f1644 45%, #0b0918 100%); }

  /* ====== JARVIS SEMBOLÜ (ağ küresi) ====== */
  .jarvis {
    position: relative;
    width: min(86vw, 460px); height: min(86vw, 460px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    filter: drop-shadow(0 0 26px rgba(150,110,230,0.28));
    transition: filter 0.6s ease, transform 0.3s ease;
  }
  .jarvis:active { transform: scale(0.98); }
  .jarvis.on { filter: drop-shadow(0 0 46px rgba(160,120,255,0.55)); }
  body.speaking .jarvis { filter: drop-shadow(0 0 52px rgba(255,209,102,0.55)); }
  body.thinking .jarvis { filter: drop-shadow(0 0 52px rgba(180,139,255,0.6)); }
  #net { width: 100%; height: 100%; display: block; }

  .layer { position: absolute; border-radius: 50%; left: 50%; top: 50%; translate: -50% -50%; }

  /* dış tik halkası */
  .ticks {
    width: 100%; height: 100%;
    background: repeating-conic-gradient(var(--accent) 0deg 1.2deg, transparent 1.2deg 6deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 11px), #000 calc(100% - 10px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 11px), #000 calc(100% - 10px));
    opacity: 0.55; animation: spin 26s linear infinite;
    transition: background 0.6s ease;
  }
  /* dış ince halka */
  .ring-outer {
    width: 86%; height: 86%; border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
    border-top-color: var(--accent); border-left-color: var(--accent);
    animation: spin 14s linear infinite;
  }
  /* segmentli orta halka (ters yön) */
  .ring-mid {
    width: 68%; height: 68%;
    border: 3px dashed color-mix(in srgb, var(--accent) 45%, transparent);
    animation: spin-rev 10s linear infinite;
    opacity: 0.8;
  }
  /* iç parlayan halka */
  .ring-inner {
    width: 52%; height: 52%;
    border: 1px solid color-mix(in srgb, var(--accent) 80%, transparent);
    box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 60%, transparent),
                inset 0 0 16px color-mix(in srgb, var(--accent) 35%, transparent);
    animation: spin 7s linear infinite;
  }
  /* radar tarama süpürmesi */
  .scan {
    width: 86%; height: 86%;
    background: conic-gradient(from 0deg, transparent 0deg, color-mix(in srgb, var(--accent) 38%, transparent) 50deg, transparent 90deg);
    -webkit-mask: radial-gradient(farthest-side, #000 40%, transparent 72%);
            mask: radial-gradient(farthest-side, #000 40%, transparent 72%);
    animation: spin 4s linear infinite; opacity: 0.7;
  }
  /* altıgen çekirdek çerçevesi */
  .hex {
    width: 40%; height: 40%;
    border: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    border-radius: 0;
    animation: spin-rev 18s linear infinite, hexpulse 3s ease-in-out infinite;
  }

  /* yörünge noktaları */
  .orbit { width: 100%; height: 100%; animation: spin var(--dur,9s) linear infinite; }
  .orbit.o2 { width: 74%; height: 74%; animation: spin-rev 12s linear infinite; }
  .orbit.o3 { width: 60%; height: 60%; animation: spin 6s linear infinite; }
  .orbit .dot {
    position: absolute; top: -4px; left: 50%; translate: -50% 0;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent-soft);
    box-shadow: 0 0 12px var(--accent), 0 0 22px var(--accent);
  }
  .orbit.o2 .dot { width: 6px; height: 6px; }
  .orbit.o3 .dot { width: 7px; height: 7px; }

  /* merkez çekirdek */
  .core {
    width: 26%; height: 26%; border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, #ffffff 0%, var(--accent-soft) 30%, var(--accent) 65%, color-mix(in srgb, var(--accent) 50%, #04121a) 100%);
    box-shadow: 0 0 30px var(--accent), 0 0 60px color-mix(in srgb, var(--accent) 60%, transparent), inset 0 0 18px rgba(255,255,255,0.6);
    animation: breathe 3.4s ease-in-out infinite;
    transition: background 0.6s ease, box-shadow 0.6s ease;
  }

  /* ===== DURUM RENKLERİ ===== */
  /* kapalı (idle): soluk ve yavaş */
  body:not(.on-state) .jarvis { --accent: var(--idle); --accent-soft: #8fb6c6; }
  body:not(.on-state) .ticks,
  body:not(.on-state) .scan { animation-play-state: paused; }
  body:not(.on-state) .core { animation-duration: 6s; opacity: 0.85; }

  /* açık (dinliyor): parlak camgöbeği, hızlı */
  body.on-state .jarvis { --accent: #56e6ff; --accent-soft: #b9f4ff; }

  /* düşünüyor: mor */
  body.thinking .jarvis { --accent: var(--purple); --accent-soft: #ddc9ff; }
  body.thinking .scan { animation-duration: 1.6s; }

  /* konuşuyor: altın + canlı çekirdek */
  body.speaking .jarvis { --accent: var(--gold); --accent-soft: #fff0c0; }
  body.speaking .core { animation: talk 0.5s ease-in-out infinite; }
  body.speaking .scan { animation-duration: 2.4s; }

  /* aktifken genel hızlanma */
  body.on-state .ring-outer { animation-duration: 9s; }
  body.on-state .ring-inner { animation-duration: 4.5s; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes talk { 0%,100% { transform: scale(1); } 25% { transform: scale(1.18); } 60% { transform: scale(0.94); } }
  @keyframes hexpulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

  /* küçük sessize alma simgesi */
  .mute {
    position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); right: 18px;
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer; z-index: 5;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(150,210,235,0.25);
    color: #cfeefb; backdrop-filter: blur(4px); transition: all 0.2s;
  }
  .mute:active { transform: scale(0.9); }

  /* üst ses dalgası (sesimi ifade eder) */
  .voicebar {
    position: fixed; top: calc(20px + env(safe-area-inset-top)); left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 4; pointer-events: none;
  }
  #wave { width: min(540px, 88vw); height: 64px; display: block; }
  .vcap {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.72rem; letter-spacing: 0.06rem; color: #b9a3e6;
    display: flex; align-items: center; gap: 8px; opacity: 0.85; text-align: center; padding: 0 14px;
  }
  .vcap .rec { width: 8px; height: 8px; border-radius: 50%; background: #5a4a78; flex: 0 0 auto; }
  body.on-state .vcap .rec { background: #ff5a6e; box-shadow: 0 0 10px #ff5a6e; animation: recblink 1.1s ease-in-out infinite; }
  @keyframes recblink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* aşama / ilerleme göstergesi (alt mor alan) */
  .stage {
    position: fixed; left: 0; right: 0;
    bottom: calc(26px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 0.78rem; letter-spacing: 0.22rem; text-transform: uppercase;
    color: #c9b3ff; text-shadow: 0 0 12px rgba(150,110,235,0.5);
    pointer-events: none; z-index: 4; transition: color 0.4s;
    padding: 0 16px; text-align: center;
  }
  .stage .dot-led {
    width: 8px; height: 8px; border-radius: 50%;
    background: #8f7ab8; box-shadow: 0 0 8px #8f7ab8; flex: 0 0 auto;
  }
  body.on-state  .stage { color: #cdb6ff; } body.on-state  .dot-led { background:#a878ff; box-shadow:0 0 10px #a878ff; }
  body.thinking  .stage { color: #d8c2ff; } body.thinking  .dot-led { background:#b48bff; box-shadow:0 0 12px #b48bff; animation: ledpulse 0.9s ease-in-out infinite; }
  body.speaking  .stage { color: #ffe39a; } body.speaking  .dot-led { background:#ffd166; box-shadow:0 0 12px #ffd166; }
  .stage.busy .dot-led { animation: ledpulse 0.9s ease-in-out infinite; }
  @keyframes ledpulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.5); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <!-- Üst ses dalgası: gerçek mikrofon sesini gösterir -->
  <div class="voicebar" id="voicebar">
    <canvas id="wave"></canvas>
    <div class="vcap" id="vcap"><span class="rec" id="rec"></span><span id="vcapText">Mikrofon kapalı</span></div>
  </div>

  <div class="jarvis" id="jarvis" role="button" aria-label="Jarvis — başlatmak için dokun" tabindex="0">
    <canvas id="net"></canvas>
  </div>

  <div class="mute" id="muteBtn" role="button" aria-label="Sesi aç/kapat">🔊</div>

  <!-- Aşama / ilerleme göstergesi -->
  <div class="stage" id="stage"><span class="dot-led" id="led"></span><span id="stageText">Beklemede</span></div>

<script src="jarvis-brain.js"></script>
<script>
/* ============================================================
   J.A.R.V.I.S — Sade arayüz, tam beyin
   Sembole dokun -> başlat/durdur. Sembolün rengi/animasyonu durumu gösterir:
   soluk+yavaş = kapalı · camgöbeği = dinliyor · mor = düşünüyor · altın = konuşuyor
   ============================================================ */
(function () {
  "use strict";
  const WAKE_WORD = "jarvis";
  const LANG = "tr-TR";

  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isSafari = /^((?!chrome|android|crios|fxios|edg).)*safari/i.test(ua);

  /* ====================== SES TONU (dost canlısı, kalın erkek) ====================== */
  const VOICE = { rate: 1.0, pitch: 0.85 };    // sıcak, kalın ama robotik olmayan ton
  // erkek/kadın ipucu kelimeleri (tarayıcıya göre ses isimleri değişir)
  const MALE_HINTS   = /(male|erkek|man|mehmet|tolga|baris|barış|emir|deniz|cem|kerem|google türkçe|murat|daniel|arthur|george|rishi)/i;
  const FEMALE_HINTS = /(female|kadın|woman|yelda|filiz|seda|aylin|elif|zeynep|samantha|karen|tessa)/i;

  /* ====================== BEYİN (jarvis-brain.js) ======================
     Tüm bilgi ve mantık ortak beyinden gelir; testlerle aynı kaynağı kullanır. */
  const B = window.JARVIS || {};
  const norm = B.norm, lev = B.lev, matchesWake = B.matchesWake, stripWake = B.stripWake,
        KNOWLEDGE = B.KNOWLEDGE, WEATHER_CODES = B.WEATHER_CODES,
        findKnowledge = B.findKnowledge, classifyIntent = B.classifyIntent;

  /* ====================== KONUM & İZİN DURUMU ====================== */
  let lastCoords = null;            // { lat, lon, ts }
  try { const cached = JSON.parse(localStorage.getItem("jarvis_coords")||"null"); if(cached) lastCoords = cached; } catch(_){}
  function geoConsent(){ return localStorage.getItem("jarvis_geo_consent")==="1"; }
  function setGeoConsent(v){ localStorage.setItem("jarvis_geo_consent", v?"1":"0"); }

  /* Bilgi veritabanı ve hava kodları jarvis-brain.js içinde */

  /* ====================== DOM & State ====================== */
  const body = document.body;
  const jarvis = document.getElementById("jarvis");
  const muteBtn = document.getElementById("muteBtn");
  const stageEl = document.getElementById("stage");
  const stageText = document.getElementById("stageText");
  const waveCanvas = document.getElementById("wave");
  const vcapText = document.getElementById("vcapText");

  let recognition=null, listening=false, awake=false, muted=false;
  let awakeTimer=null, proactiveTimer=null, lastInteraction=Date.now();
  let isSpeaking=false, ttsPrimed=false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;

  /* Aşama / ilerleme göstergesi (alt mor alan) */
  function setStatus(text, kind){
    if (stageText) stageText.textContent = text;
    if (stageEl) stageEl.classList.toggle("busy", kind === "busy");
  }
  function addLog(){ /* arayüzde konuşma metni gösterilmiyor */ }
  let liveText = { set textContent(_) {} };

  /* ====================== Ses tanıma ====================== */
  function buildRecognition() {
    const r = new SpeechRecognition();
    r.lang = LANG;
    r.continuous = !(isIOS || isSafari);
    r.interimResults = true;
    r.maxAlternatives = 5;   // daha fazla aday -> daha hassas yakalama
    r.onstart = () => { if(!isSpeaking) setStatus(awake?"Komut bekleniyor":"Dinleniyor"); };
    r.onresult = (event) => {
      if (isSpeaking) return;
      let finalText="", interim="";
      for (let i=event.resultIndex; i<event.results.length; i++) {
        const res = event.results[i];
        // tüm alternatifleri topla; en uzun/dolu olanı kullan, wake için hepsine bak
        let best = "";
        for (let k=0; k<res.length; k++) if (res[k].transcript.length > best.length) best = res[k].transcript;
        if (res.isFinal) finalText += best + " ";
        else interim += best + " ";
      }
      // Uyumadan önce: anlık (interim) sonuçta bile "Jarvis" geçerse hemen uyan
      if (!awake && interim && matchesWake(interim)) wake();
      if (finalText.trim()) handleSpeech(finalText.trim());
    };
    r.onerror = (e) => {
      if (e.error==="no-speech"||e.error==="aborted") return;
      if (e.error==="not-allowed"||e.error==="service-not-allowed") { stopListening(); return; }
    };
    r.onend = () => { if (listening && !isSpeaking) { try { r.start(); } catch(_){} } };
    return r;
  }
  function restartRecognition(){ if (listening && recognition) { try { recognition.start(); } catch(_){} } }

  /* ====================== Yönlendirme ====================== */
  function handleSpeech(text) {
    const lower = text.toLocaleLowerCase("tr-TR");
    lastInteraction = Date.now();
    if (!awake) {
      if (matchesWake(lower)) {
        wake();
        // "jarvis"ten sonraki kısmı komut olarak al (bulanık eşleşmeleri de kes)
        const after = stripWake(lower);
        if (after) route(after); else speak("Buyurun Murathan.");
      }
      return;
    }
    route(stripWake(lower));
  }
  function wake() { awake=true; setStatus("Komut bekleniyor"); resetAwakeTimer(); }
  function resetAwakeTimer() { clearTimeout(awakeTimer); awakeTimer=setTimeout(()=>{ awake=false; if(listening && !isSpeaking) setStatus("Dinleniyor"); }, 20000); }

  /* Yönlendirici: niyeti ortak beyinden al, ona göre yeteneği çalıştır */
  function route(cmd) {
    resetAwakeTimer(); lastInteraction=Date.now();
    const intent = classifyIntent(cmd);
    switch (intent) {
      case "empty":      speak("Seni dinliyorum Murathan."); return;
      case "name_set":   saveName(cmd); return;
      case "name_get":   tellName(); return;
      case "location":   setStatus("Konum alınıyor","busy"); tellLocation(); return;
      case "clothing":   recommendClothing(cmd); return;
      case "weather":    handleWeather(cmd); return;
      case "time":       speak("Saat şu an "+nowTime()+" Murathan."); return;
      case "date":       speak("Bugün "+nowDate()+" Murathan."); return;
      case "note_add":   addNote(cmd); return;
      case "note_read":  readNotes(); return;
      case "note_clear": localStorage.removeItem("jarvis_notes"); speak("Tüm notlarını sildim Murathan."); return;
      case "reminder":   setReminder(cmd); return;
      case "math":       doMath(cmd); return;
      case "knowledge":  { const k = findKnowledge(cmd); if (k) { speak(k.a); return; } break; }
      case "greeting":   speak(greeting()); return;
      case "identity":   speak("Ben Jarvis Murathan, kişisel yapay zeka asistanın."); return;
      case "skills":     listSkills(); return;
      case "smalltalk":  speak("Tüm sistemlerim optimal çalışıyor Murathan, teşekkür ederim."); return;
      case "thanks":     speak("Rica ederim Murathan, her zaman buradayım."); return;
      case "joke":       speak(randomJoke()); return;
      case "sleep":      speak("Uykuya geçiyorum Murathan. Beni 'Jarvis' diyerek uyandırabilirsin."); awake=false; return;
    }
    // Açık uçlu her şey -> Wikipedia (canlı medya)
    askWikipedia(cmd);
  }

  /* ====================== Kişisel bilgi (isim) ====================== */
  function saveName(cmd){
    let name = cmd.replace(/adımı kaydet|ismimi kaydet|benim adım|benim ismim|bana de ki|olarak kaydet|adımla seslen|seslen|olsun/gi,"").trim();
    name = name.replace(/[^a-zçğıöşüA-ZÇĞİÖŞÜ\s]/g,"").trim().split(/\s+/)[0] || "";
    if(!name){ speak("Adını tam anlayamadım Murathan, 'benim adım ...' şeklinde söyler misin?"); return; }
    name = name.charAt(0).toLocaleUpperCase("tr-TR")+name.slice(1);
    localStorage.setItem("jarvis_name", name);
    speak("Memnun oldum "+name+". Adını hafızama kaydettim.");
  }
  function tellName(){
    const name=localStorage.getItem("jarvis_name");
    speak(name ? "Adın "+name+" Murathan." : "Henüz adını bilmiyorum Murathan. 'Benim adım ...' diyerek bana öğretebilirsin.");
  }
  function userName(){ return localStorage.getItem("jarvis_name") || "Murathan"; }

  /* ====================== AÇIK BİLGİ BEYNİ (sınırsız) ======================
     Veritabanı sadece hızlı/çevrimdışı yanıtlar içindir; gerisini canlı
     Wikipedia'dan, çok aşamalı arama ile getirir. Bir insan gibi neredeyse
     her konuda cevap verebilir. tr başarısız olursa İngilizce'ye düşer. */
  function cleanQuery(cmd) {
    return cmd.replace(/\b(nedir|kimdir|kim|ne demek|ne demektir|nerededir|nerede|nedendir|neden|nasıl|anlat|anlatır mısın|hakkında bilgi ver|hakkında|bilgi ver|söyle|söyler misin|açıkla|açıklar mısın|bana|kısaca|biraz)\b/gi," ")
              .replace(/[?¿!.]/g," ").replace(/\s+/g," ").trim();
  }
  function wikiSummary(lang, title){
    return fetch("https://"+lang+".wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title))
      .then(r=> r.ok ? r.json() : null);
  }
  function wikiSearchTitle(lang, q){
    // 1) hızlı başlık tamamlama  2) tam metin arama
    return fetch("https://"+lang+".wikipedia.org/w/api.php?action=opensearch&limit=1&namespace=0&format=json&origin=*&search="+encodeURIComponent(q))
      .then(r=>r.json()).then(d=> (d && d[1] && d[1][0]) || null)
      .catch(()=>null)
      .then(t=> t || fetch("https://"+lang+".wikipedia.org/w/rest.php/v1/search/page?limit=1&q="+encodeURIComponent(q))
        .then(r=>r.json()).then(d=> (d && d.pages && d.pages[0] && d.pages[0].title) || null).catch(()=>null));
  }
  function tryLang(lang, q){
    return wikiSearchTitle(lang, q).then(title=>{
      if (!title) return null;
      return wikiSummary(lang, title).then(s=>{
        if (s && s.extract && s.type !== "disambiguation" && !/olabilir:|may refer to/i.test(s.extract)) return s.extract;
        return null;
      });
    });
  }
  function askWikipedia(cmd) {
    let q = cleanQuery(cmd);
    if (!q || q.length < 2) { speak("Bunu tam anlayamadım Murathan, biraz daha açar mısın?"); return; }
    body.classList.add("thinking"); setStatus("Araştırıyorum","busy");
    const done = (txt)=>{ body.classList.remove("thinking"); speak(txt); };
    // Türkçe dene -> olmazsa kısalt -> olmazsa İngilizce dene
    tryLang("tr", q)
      .then(t=> t || (q.split(" ").length>2 ? tryLang("tr", q.split(" ").slice(0,2).join(" ")) : null))
      .then(t=> t || tryLang("en", q))
      .then(t=>{
        if (t) done(firstSentences(t,3));
        else done("Bu konuda net bir bilgi bulamadım Murathan; sorunu biraz farklı sorarsan tekrar araştırırım.");
      })
      .catch(()=> done("Şu an bilgiye ulaşamadım Murathan, internet bağlantını kontrol et."));
  }
  function firstSentences(text,n){ const p=text.replace(/\s+/g," ").match(/[^.!?]+[.!?]+/g); if(!p) return text; let o=p.slice(0,n).join(" ").trim(); if(o.length>360) o=o.slice(0,357)+"..."; return o; }

  /* ====================== KONUM (izinli, önbellekli) ======================
     getLocation: taze önbellek varsa onu kullanır; yoksa izin isteyip alır,
     sonra localStorage'a kaydeder. Böylece "konumumun havası" sorulduğunda
     hızlı yanıt verir. */
  function getLocation(onOk, onErr){
    const FRESH = 10*60*1000; // 10 dk
    if (lastCoords && (Date.now()-lastCoords.ts) < FRESH) { onOk(lastCoords.lat, lastCoords.lon); return; }
    if (!navigator.geolocation) { onErr && onErr("yok"); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>{
        lastCoords = { lat:pos.coords.latitude, lon:pos.coords.longitude, ts:Date.now() };
        try { localStorage.setItem("jarvis_coords", JSON.stringify(lastCoords)); } catch(_){}
        setGeoConsent(true);
        onOk(lastCoords.lat, lastCoords.lon);
      },
      err=>{ if(err.code===1) setGeoConsent(false); onErr && onErr(err.code===1?"izin":"hata"); },
      { timeout:10000, enableHighAccuracy:false, maximumAge: 5*60*1000 }
    );
  }
  // Koordinattan yer adı (ücretsiz, anahtarsız reverse geocode)
  function reverseGeocode(lat,lon){
    return fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+lat+"&longitude="+lon+"&localityLanguage=tr")
      .then(r=>r.json())
      .then(d=>{ const parts=[d.city||d.locality, d.principalSubdivision, d.countryName].filter(Boolean); return parts.join(", ")||null; })
      .catch(()=>null);
  }
  function tellLocation(){
    getLocation(
      (lat,lon)=>{ reverseGeocode(lat,lon).then(place=> speak(place ? "Şu an "+place+" konumundasın Murathan." : "Konumunu aldım fakat yer adını çözemedim Murathan.")); },
      (why)=>{ if(why==="izin") speak("Konum iznini vermemişsin Murathan. Lütfen tarayıcıdan konum erişimine izin ver."); else speak("Konumuna ulaşamadım Murathan."); }
    );
  }

  /* ====================== Ne giymeliyim? ====================== */
  function recommendClothing(cmd){

      fetch(url).then(r=>r.json()).then(d=>{
        if(!d||!d.current){ speak("Hava verisini alamadığım için öneri veremedim."); return; }

        else if([71,73,75,77,85,86].includes(code)) s+=" Kar yağışı var, su geçirmez bir bot giymeni öneririm.";
        if(wind>=30) s+=" Rüzgar da kuvvetli, rüzgar kesen bir dış katman iyi olur.";
        speak(s);
      }).catch(()=>speak("Hava durumuna ulaşamadığım için öneri veremedim."));
    };
    if (city) { geocode(city).then(loc=> loc ? give(loc.latitude,loc.longitude) : speak(city+" diye bir yer bulamadım.")).catch(()=>speak("Hava servisine ulaşamadım.")); return; }
    getLocation(give, (why)=> why==="izin" ? speak("Kıyafet önerisi için konumuna ihtiyacım var. Konum iznini verir misin, ya da bir şehir söyle.") : speak("Konumuna ulaşamadığım için öneremedim."));

  /* ====================== Hava durumu ====================== */
  function handleWeather(cmd) {
    const n = norm(cmd);
    const wantsMyLocation = /(konumum|buranin|burada|bulundugum|yerimde|neredeysem|su an)/.test(n) || !extractCity(cmd);
    const city = wantsMyLocation ? null : extractCity(cmd);

    if (city) {
      speak(city+" için hava durumunu kontrol ediyorum Murathan.");
      geocode(city).then(loc=> loc ? fetchWeather(loc.latitude,loc.longitude,loc.name) : speak(city+" adında bir yer bulamadım Murathan.")).catch(()=>speak("Hava durumu servisine ulaşamadım Murathan."));
      return;
    }
    speak("Konumuna göre hava durumunu kontrol ediyorum Murathan.");
    getLocation(
      (lat,lon)=>{ reverseGeocode(lat,lon).then(place=> fetchWeather(lat,lon, place||"Konumun")); },
      (why)=>{ if(why==="izin") speak("Konum izni vermedin Murathan. İzin verirsen konumunun havasını söylerim; ya da bir şehir adı söyle, örneğin 'İzmir hava durumu'."); else speak("Konumunu alamadım Murathan, lütfen bir şehir söyle."); }
    );
  }
  function extractCity(cmd){ let c=cmd.replace(/hava durumu|hava nasıl|hava|nasıl|durumu|tahmin|bugün|yarın|için|de|da|te|ta/g," ").replace(/[^a-zçğıöşü\s]/gi," ").replace(/\s+/g," ").trim(); if(!c||c.length<3) return null; return c.split(" ").filter(w=>w.length>2).slice(-2).join(" ").trim()||null; }
  function geocode(name){ return fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(name)+"&count=1&language=tr&format=json").then(r=>r.json()).then(d=>(d&&d.results&&d.results.length)?{latitude:d.results[0].latitude,longitude:d.results[0].longitude,name:d.results[0].name+(d.results[0].admin1?", "+d.results[0].admin1:"")}:null); }
  function fetchWeather(lat,lon,label){
    setStatus("Hava durumu alınıyor","busy");
    const url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=2";
    fetch(url).then(r=>r.json()).then(d=>{
      if(!d||!d.current){ speak("Hava durumu verisini alamadım Murathan."); return; }
      const c=d.current, desc=WEATHER_CODES[c.weather_code]||"değişken", temp=Math.round(c.temperature_2m), feels=Math.round(c.apparent_temperature), hum=c.relative_humidity_2m, wind=Math.round(c.wind_speed_10m);
      let msg=label+" için şu an hava "+desc+", sıcaklık "+temp+" derece";
      if(Math.abs(feels-temp)>=2) msg+=", hissedilen "+feels+" derece";
      msg+=" Murathan. Nem yüzde "+hum+", rüzgar saatte "+wind+" kilometre.";
      if(d.daily&&d.daily.time&&d.daily.time.length>1){
        const tmax=Math.round(d.daily.temperature_2m_max[1]),tmin=Math.round(d.daily.temperature_2m_min[1]),tdesc=WEATHER_CODES[d.daily.weather_code[1]]||"değişken",rain=d.daily.precipitation_probability_max?d.daily.precipitation_probability_max[1]:null;
        msg+=" Yarın ise "+tdesc+", "+tmin+" ile "+tmax+" derece arası bekleniyor";
        if(rain!=null&&rain>=40) msg+=", yağış ihtimali yüzde "+rain+", şemsiye almanızı öneririm";
        msg+=".";
      }
      if(temp<=5) msg+=" Hava soğuk, kalın giyin Murathan.";
      else if(temp>=30) msg+=" Hava sıcak, bol su için Murathan.";
      if([61,63,65,80,81,82,95,96,99].includes(c.weather_code)) msg+=" Dışarı çıkacaksan şemsiye al.";
      speak(msg);
    }).catch(()=>speak("Hava durumu servisine ulaşırken sorun oluştu Murathan."));
  }

  /* ====================== Notlar / Hatırlatıcı / Hesap ====================== */
  function getNotes(){ try { return JSON.parse(localStorage.getItem("jarvis_notes")||"[]"); } catch { return []; } }
  function saveNotes(n){ localStorage.setItem("jarvis_notes", JSON.stringify(n)); }
  function addNote(cmd){ let note=cmd.replace(/not al|not et|kaydet|şunu yaz|ki|diye/g,"").trim(); if(!note){ speak("Ne not almamı istersin Murathan?"); return; } const n=getNotes(); n.push({text:note,at:new Date().toLocaleString("tr-TR")}); saveNotes(n); speak("Not alındı Murathan: "+note); }
  function readNotes(){ const n=getNotes(); if(!n.length){ speak("Kayıtlı notun yok Murathan."); return; } speak(n.length+" notun var Murathan. "+n.map((x,i)=>(i+1)+". "+x.text).join(". ")); }
  function setReminder(cmd){
    const m=cmd.match(/(\d+)\s*(saniye|dakika|dk|saat)/);
    if(!m){ speak("Ne kadar süre sonra hatırlatayım Murathan?"); return; }
    let amount=parseInt(m[1],10); const unit=m[2]; let ms=amount*1000;
    if(unit.startsWith("dak")||unit==="dk") ms=amount*60000; else if(unit==="saat") ms=amount*3600000;
    let what=cmd.split(/hatırlat|alarm|zamanlayıcı/)[0].replace(/(\d+)\s*(saniye|dakika|dk|saat)\s*(sonra)?/,"").trim()||"hatırlatma";
    speak(amount+" "+unit+" sonra hatırlatacağım Murathan: "+what);
    setTimeout(()=>{ speak("Hatırlatma zamanı geldi Murathan: "+what); try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(_){} }, ms);
  }
  function doMath(cmd){
    let expr=cmd.replace(/hesapla|kaç eder|kaç yapar|kaçtır/g,"").replace(/artı|topla|toplam/g,"+").replace(/eksi|çıkar/g,"-").replace(/çarpı|kere|çarp/g,"*").replace(/bölü|böl/g,"/").replace(/[^0-9+\-*/.,()\s]/g,"").replace(/,/g,".").trim();
    if(!expr||!/[0-9]/.test(expr)){ speak("Hangi işlemi hesaplamamı istersin Murathan?"); return; }
    try { if(!/^[0-9+\-*/.()\s]+$/.test(expr)) throw 0; const res=Function('"use strict";return ('+expr+')')(); if(typeof res!=="number"||!isFinite(res)) throw 0; speak("Sonuç "+(Math.round(res*1000)/1000)+" Murathan."); }
    catch { speak("Bu işlemi hesaplayamadım Murathan."); }
  }

  /* ====================== TTS (ofis erkeği / butler tonu) ====================== */
  let chosenVoice = null;
  function pickVoice(){
    if (!synth) return null;
    const all = synth.getVoices();
    const tr = all.filter(v => v.lang && v.lang.toLowerCase().startsWith("tr"));
    // 1) Türkçe erkek ses  2) Türkçe (kadın değilse)  3) herhangi Türkçe
    let v = tr.find(x => MALE_HINTS.test(x.name))
         || tr.find(x => !FEMALE_HINTS.test(x.name))
         || tr[0];
    // Türkçe ses yoksa: İngiliz erkek (butler havası) -> herhangi erkek -> ilk
    if (!v) v = all.find(x => /en-GB/i.test(x.lang) && MALE_HINTS.test(x.name))
              || all.find(x => MALE_HINTS.test(x.name))
              || all[0];
    chosenVoice = v || null;
    return chosenVoice;
  }
  function primeTTS(){ if(ttsPrimed||!synth) return; try{ const u=new SpeechSynthesisUtterance(""); u.volume=0; synth.speak(u); ttsPrimed=true; }catch(_){} }
  let keepAlive=null;
  // Chrome, ~15 sn'den uzun konuşmada sesi kesip duraklatır; düzenli resume ile akıcı tut
  function startKeepAlive(){ clearInterval(keepAlive); keepAlive=setInterval(()=>{ if(synth&&synth.speaking){ try{ synth.pause(); synth.resume(); }catch(_){} } else clearInterval(keepAlive); }, 9000); }
  function speak(text){
    if(muted||!synth){ restartRecognition(); return; }
    synth.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=LANG; u.rate=VOICE.rate; u.pitch=VOICE.pitch; u.volume=1;
    const v=chosenVoice||pickVoice(); if(v) u.voice=v;
    u.onstart=()=>{ isSpeaking=true; body.classList.add("speaking"); setStatus("Yanıtlıyor"); startKeepAlive(); };
    u.onend=()=>{ isSpeaking=false; body.classList.remove("speaking"); clearInterval(keepAlive); setStatus(listening?(awake?"Komut bekleniyor":"Dinleniyor"):"Beklemede"); restartRecognition(); };
    u.onerror=()=>{ isSpeaking=false; body.classList.remove("speaking"); clearInterval(keepAlive); restartRecognition(); };
    if((isIOS||isSafari)&&recognition){ try{ recognition.stop(); }catch(_){} }
    synth.speak(u);
  }

  /* ====================== Yardımcılar ====================== */
  function nowTime(){ return new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}); }
  function nowDate(){ return new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
  function greeting(){ const h=new Date().getHours(); const p=h<6?"İyi geceler":h<12?"Günaydın":h<18?"İyi günler":"İyi akşamlar"; return p+" "+userName()+". Sana nasıl yardımcı olabilirim?"; }

  function listSkills(){ speak("Bayağı bir şey yapabilirim Murathan. Konumunun ya da istediğin şehrin havasını söylerim, ne giymen gerektiğini öneririm, neredeysen bulurum, adını hatırlarım, not alıp okurum, hatırlatıcı kurarım, matematik yaparım ve bilim, uzay, tarih, teknoloji gibi pek çok konuda bilgi veririm. Bilmediğimi de internetten araştırıp özetlerim."); }

  /* ====================== Proaktif kontrol ====================== */
  function startProactive(){
    clearInterval(proactiveTimer);
    proactiveTimer=setInterval(()=>{
      if(!listening||muted) return;
      if(Date.now()-lastInteraction>4*60*1000){ const p=["Murathan, bir şeye ihtiyacın var mı?","Buradayım Murathan, yardımcı olabileceğim bir şey var mı?","Her şey yolunda mı Murathan?","Bir mola verip su içmenin tam zamanı olabilir Murathan."]; speak(p[Math.floor(Math.random()*p.length)]); lastInteraction=Date.now(); }
    }, 60*1000);

  /* ====================== SES DALGASI (gerçek mikrofon) ======================
     Web Audio ile mikrofon seviyesini okuyup üstteki çubukları canlandırır.
     Fotodaki gibi: ortadakiler renkli ve daha hareketli, sesini ifade eder. */
  let audioCtx=null, analyser=null, micStream=null, waveRAF=null, freqData=null;
  function startMic(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { drawWave(); return; }
    navigator.mediaDevices.getUserMedia({ audio:true }).then(stream=>{
      micStream = stream;
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.78;
      src.connect(analyser);
      freqData = new Uint8Array(analyser.frequencyBinCount);
      if (vcapText) vcapText.textContent = "Konuş Murathan, gerçek zamanlı dinliyorum…";
    }).catch(()=>{ if(vcapText) vcapText.textContent="Mikrofon izni gerekli"; });
    if (!waveRAF) drawWave();
  }
  function stopMic(){
    try { micStream && micStream.getTracks().forEach(t=>t.stop()); } catch(_){}
    try { audioCtx && audioCtx.close(); } catch(_){}
    micStream=null; audioCtx=null; analyser=null; freqData=null;
    if (vcapText) vcapText.textContent="Mikrofon kapalı";
  }
  function drawWave(){
    if (!waveCanvas) return;
    const ctx = waveCanvas.getContext("2d");
    const DPR = Math.min(window.devicePixelRatio||1, 2);
    const rect = waveCanvas.getBoundingClientRect();
    const W = waveCanvas.width = Math.max(2, rect.width*DPR);
    const H = waveCanvas.height = Math.max(2, rect.height*DPR);
    const BARS = 28, gap = W/BARS, cy = H/2;
    let t = 0;
    function loop(){
      t += 0.05;
      ctx.clearRect(0,0,W,H);
      // konuşuyorsa altın, dinliyorsa mor, beklemede soluk
      const cls = document.body.classList;
      const accent = cls.contains("speaking") ? [255,209,102] : cls.contains("thinking") ? [180,139,255] : [168,120,255];
      if (analyser && freqData) analyser.getByteFrequencyData(freqData);
      for (let i=0;i<BARS;i++){
        const mid = 1 - Math.abs(i-(BARS-1)/2)/((BARS-1)/2);   // 0 kenar .. 1 orta
        let amp;
        if (analyser && freqData){
          const idx = Math.floor((i/BARS)*freqData.length*0.7);
          amp = (freqData[idx]/255) * (0.45+0.55*mid);
        } else {
          amp = (0.06 + 0.05*Math.sin(t+i*0.5)) * (0.5+mid); // boştayken hafif nefes
        }
        const h = Math.max(H*0.06, amp*H*0.92);
        const x = i*gap + gap*0.5;
        const r = Math.min(gap*0.34, DPR*3);
        const a = 0.35 + 0.6*mid + amp*0.3;
        ctx.fillStyle = "rgba("+accent[0]+","+accent[1]+","+accent[2]+","+Math.min(1,a).toFixed(3)+")";
        roundBar(ctx, x-r, cy-h/2, r*2, h, r);
      }
      waveRAF = requestAnimationFrame(loop);
    }
    if (waveRAF) cancelAnimationFrame(waveRAF);
    loop();
  }
  function roundBar(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }
  window.addEventListener("resize", ()=>{ if(waveRAF){ cancelAnimationFrame(waveRAF); waveRAF=null; drawWave(); } });
  drawWave(); // başta boş/nefes modunda çalışsın

  /* ====================== Başlat / Durdur (sembole dokun) ====================== */
  function startListening(){
    primeTTS();
    if(listening) return;
    if(!SpeechRecognition){ body.classList.add("on-state"); jarvis.classList.add("on"); speak("Sesli tanıma bu tarayıcıda yok Murathan, fakat sesli yanıt verebilirim."); return; }
    listening=true; recognition=buildRecognition();
    try{ recognition.start(); }catch(_){}
    startMic();
    body.classList.add("on-state"); jarvis.classList.add("on");
    jarvis.setAttribute("aria-label","Jarvis dinliyor — durdurmak için dokun");
    lastInteraction=Date.now(); startProactive();

    const hello = "Sistemler çevrimiçi, " + userName() + ". Seni dinliyorum.";

    // İlk açılışta izinleri iste (mikrofon zaten istendi; şimdi konum)
    if (!localStorage.getItem("jarvis_onboarded")) {
      localStorage.setItem("jarvis_onboarded","1");
      speak(hello + " Sana daha iyi yardımcı olabilmem için konumuna erişmek istiyorum; izin verirsen bulunduğun yerin havasını ve ne giymen gerektiğini anında söylerim.");
      // izin penceresini tetikle ve konumu önbelleğe al
      getLocation(()=>{}, ()=>{});
    } else {
      speak(hello);
      if (geoConsent() && !lastCoords) getLocation(()=>{}, ()=>{});  // sessizce tazele
    }
  }
  function stopListening(){
    listening=false; awake=false; clearTimeout(awakeTimer); clearInterval(proactiveTimer);
    if(recognition){ try{ recognition.stop(); }catch(_){} }
    stopMic();
    if(synth) synth.cancel();
    body.classList.remove("on-state","speaking","thinking"); jarvis.classList.remove("on");
    jarvis.setAttribute("aria-label","Jarvis — başlatmak için dokun");
    setStatus("Beklemede");
  }
  function toggle(){ listening ? stopListening() : startListening(); }

  jarvis.addEventListener("click", toggle);
  jarvis.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
  muteBtn.addEventListener("click", e=>{ e.stopPropagation(); muted=!muted; muteBtn.textContent=muted?"🔇":"🔊"; if(muted&&synth) synth.cancel(); });

  if(synth) synth.onvoiceschanged = pickVoice;

  /* ====================== OTOMATİK BAŞLATMA (uygulama gibi) ======================
     Ana ekrana eklenmiş uygulama (standalone) olarak açıldığında Jarvis'i
     açar açmaz aktif etmeye çalışır. Tarayıcı güvenliği gereği mikrofon ilk
     dokunuşta başlar; bu yüzden ilk temasta da otomatik devreye girer. */
  const isStandalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  let autostarted = false;
  function autoStart(){ if(autostarted||listening) return; autostarted=true; startListening(); }
  if (isStandalone) {
    // açılır açılmaz dene (bazı tarayıcılarda direkt çalışır)
    window.addEventListener("load", ()=> setTimeout(()=>{ try{ autoStart(); }catch(_){} }, 600));
    // çalışmazsa ekrana ilk dokunuşta kesin başlat
    const arm = ()=>{ autoStart(); window.removeEventListener("pointerdown", arm); };
    window.addEventListener("pointerdown", arm, { once:true });
  }
})();

/* ====================== AĞ KÜRESİ (Higgsfield tarzı) ======================
   Bir küre yüzeyine dağıtılmış düğümler, dönerken yakın olanlar ince
   çizgilerle bağlanır; mor parıltılı, derinlikli bir takımyıldız etkisi.
   Renk ve hız Jarvis'in durumuna göre değişir. */
(function(){
  const canvas = document.getElementById("net");
  if(!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext("2d");
  const N = 180;                       // düğüm sayısı
  const pts = [];
  for(let i=0;i<N;i++){
    const phi = Math.acos(1 - 2*(i+0.5)/N);
    const theta = Math.PI*(1+Math.sqrt(5))*i;     // altın açı -> eşit dağılım
    pts.push({
      x: Math.sin(phi)*Math.cos(theta),
      y: Math.sin(phi)*Math.sin(theta),
      z: Math.cos(phi),
      pr: 0.5 + Math.random()*1.5                 // düğüm büyüklüğü
    });
  }
  let W,H,DPR,cx,cy,R;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    const rect = canvas.getBoundingClientRect();
    W = canvas.width  = Math.max(2, rect.width *DPR);
    H = canvas.height = Math.max(2, rect.height*DPR);
    cx = W/2; cy = H/2; R = Math.min(W,H)*0.46;
  }
  window.addEventListener("resize", resize);

  function palette(){
    const c = document.body.classList;
    if(c.contains("speaking")) return { node:"#ffe39a", line:"255,209,102", glow:"#ffd166" };
    if(c.contains("thinking")) return { node:"#d8c2ff", line:"180,139,255", glow:"#b48bff" };
    if(c.contains("on-state")) return { node:"#cdb6ff", line:"150,110,235", glow:"#a878ff" };
    return { node:"#9c84c8", line:"120,95,175", glow:"#6b4f9e" }; // beklemede (soluk mor)
  }
  function speed(){
    const c=document.body.classList;
    if(c.contains("thinking")) return 0.013;
    if(c.contains("speaking")) return 0.009;
    if(c.contains("on-state")) return 0.006;
    return 0.0025;                                   // beklemede yavaş döner
  }

  let ang=0, pulse=0;
  function frame(){
    ang += speed(); pulse += 0.03;
    const pal = palette();
    const breathe = 1 + Math.sin(pulse)*(document.body.classList.contains("on-state")?0.05:0.02);
    const Rb = R*breathe;
    const cosA=Math.cos(ang), sinA=Math.sin(ang);
    const tilt=0.45, cosT=Math.cos(tilt), sinT=Math.sin(tilt);
    ctx.clearRect(0,0,W,H);

    const proj=[];
    for(const p of pts){
      const x =  p.x*cosA + p.z*sinA;
      const z = -p.x*sinA + p.z*cosA;
      const y2 = p.y*cosT - z*sinT;
      const z2 = p.y*sinT + z*cosT;
      const persp = 1/(1.7 - z2*0.55);
      const depth = (z2+1)/2;                         // 0 arka .. 1 ön
      proj.push({ sx: cx + x*Rb*persp, sy: cy + y2*Rb*persp, depth, pr:p.pr });
    }

    // bağlantılar
    const maxD = Rb*0.40;
    ctx.lineWidth = DPR*0.5;
    for(let i=0;i<proj.length;i++){
      const a=proj[i];
      for(let j=i+1;j<proj.length;j++){
        const b=proj[j];
        const dx=a.sx-b.sx, dy=a.sy-b.sy;
        const d=dx*dx+dy*dy;
        if(d < maxD*maxD){
          const dist=Math.sqrt(d);
          const alpha=(1-dist/maxD)*0.45*((a.depth+b.depth)/2);
          if(alpha<0.02) continue;
          ctx.strokeStyle="rgba("+pal.line+","+alpha.toFixed(3)+")";
          ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
        }
      }
    }

    // düğümler (parıltılı)
    ctx.shadowColor=pal.glow; ctx.shadowBlur=6*DPR; ctx.fillStyle=pal.node;
    for(const a of proj){
      const r=a.pr*DPR*(0.5+a.depth);
      ctx.globalAlpha=0.25+a.depth*0.75;
      ctx.beginPath(); ctx.arc(a.sx,a.sy,r,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    requestAnimationFrame(frame);
  }
  resize(); requestAnimationFrame(frame);
})();

/* Service worker: çevrimdışı çalışma + kurulabilir uygulama
   Yeni sürüm bulununca otomatik devralıp sayfayı bir kez yeniler -> güncel kalır */
if ("serviceWorker" in navigator) {
  let refreshed = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if (refreshed) return; refreshed = true; window.location.reload();
  });
  window.addEventListener("load", ()=> {
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing;
        if (nw) nw.addEventListener("statechange", ()=>{
          if (nw.state === "installed" && navigator.serviceWorker.controller) nw.postMessage("skipWaiting");
        });
      });
      // periyodik güncelleme kontrolü
      setInterval(()=> reg.update().catch(()=>{}), 60*1000);
    }).catch(()=>{});
  });
}
</script>
