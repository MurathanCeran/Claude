<!DOCTYPE html>
<html lang="tr">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='none' stroke='%2356e6ff' stroke-width='6'/><circle cx='50' cy='50' r='18' fill='%2356e6ff'/></svg>" />
<style>
  :root {
    --accent: #56e6ff;        /* anlık duruma göre değişir */
    --accent-soft: #9af0ff;
    --idle: #4f7f95;
    --gold: #ffd166;
    --purple: #b48bff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    /* daha açık ton arka plan */
    background: radial-gradient(circle at 50% 38%, #21506e 0%, #163a52 45%, #0e2839 100%);
    color: #eaf7ff;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition: background 0.8s ease;
  }
  /* hafif ızgara dokusu */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(120,200,230,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,200,230,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
  }
  body.speaking { background: radial-gradient(circle at 50% 38%, #2a4a52 0%, #163a45 45%, #0e2832 100%); }
  body.thinking { background: radial-gradient(circle at 50% 38%, #34355e 0%, #232447 45%, #131428 100%); }

  /* ====== JARVIS SEMBOLÜ ====== */
  .jarvis {
    position: relative;
    width: min(78vw, 340px); height: min(78vw, 340px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    filter: drop-shadow(0 0 18px rgba(86,230,255,0.25));
    transition: filter 0.6s ease, transform 0.3s ease;
  }
  .jarvis:active { transform: scale(0.97); }
  .jarvis.on { filter: drop-shadow(0 0 40px rgba(86,230,255,0.6)); }
  body.speaking .jarvis { filter: drop-shadow(0 0 46px rgba(255,209,102,0.6)); }
  body.thinking .jarvis { filter: drop-shadow(0 0 46px rgba(180,139,255,0.6)); }

  .layer { position: absolute; border-radius: 50%; left: 50%; top: 50%; translate: -50% -50%; }

  /* dış tik halkası */
  .ticks {
    width: 100%; height: 100%;
    background: repeating-conic-gradient(var(--accent) 0deg 1.2deg, transparent 1.2deg 6deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 11px), #000 calc(100% - 10px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 11px), #000 calc(100% - 10px));
    opacity: 0.55; animation: spin 26s linear infinite;
    transition: background 0.6s ease;
  }
  /* dış ince halka */
  .ring-outer {
    width: 86%; height: 86%; border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
    border-top-color: var(--accent); border-left-color: var(--accent);
    animation: spin 14s linear infinite;
  }
  /* segmentli orta halka (ters yön) */
  .ring-mid {
    width: 68%; height: 68%;
    border: 3px dashed color-mix(in srgb, var(--accent) 45%, transparent);
    animation: spin-rev 10s linear infinite;
    opacity: 0.8;
  }
  /* iç parlayan halka */
  .ring-inner {
    width: 52%; height: 52%;
    border: 1px solid color-mix(in srgb, var(--accent) 80%, transparent);
    box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 60%, transparent),
                inset 0 0 16px color-mix(in srgb, var(--accent) 35%, transparent);
    animation: spin 7s linear infinite;
  }
  /* radar tarama süpürmesi */
  .scan {
    width: 86%; height: 86%;
    background: conic-gradient(from 0deg, transparent 0deg, color-mix(in srgb, var(--accent) 38%, transparent) 50deg, transparent 90deg);
    -webkit-mask: radial-gradient(farthest-side, #000 40%, transparent 72%);
            mask: radial-gradient(farthest-side, #000 40%, transparent 72%);
    animation: spin 4s linear infinite; opacity: 0.7;
  }
  /* altıgen çekirdek çerçevesi */
  .hex {
    width: 40%; height: 40%;
    border: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    border-radius: 0;
    animation: spin-rev 18s linear infinite, hexpulse 3s ease-in-out infinite;
  }

  /* yörünge noktaları */
  .orbit { width: 100%; height: 100%; animation: spin var(--dur,9s) linear infinite; }
  .orbit.o2 { width: 74%; height: 74%; animation: spin-rev 12s linear infinite; }
  .orbit.o3 { width: 60%; height: 60%; animation: spin 6s linear infinite; }
  .orbit .dot {
    position: absolute; top: -4px; left: 50%; translate: -50% 0;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent-soft);
    box-shadow: 0 0 12px var(--accent), 0 0 22px var(--accent);
  }
  .orbit.o2 .dot { width: 6px; height: 6px; }
  .orbit.o3 .dot { width: 7px; height: 7px; }

  /* merkez çekirdek */
  .core {
    width: 26%; height: 26%; border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, #ffffff 0%, var(--accent-soft) 30%, var(--accent) 65%, color-mix(in srgb, var(--accent) 50%, #04121a) 100%);
    box-shadow: 0 0 30px var(--accent), 0 0 60px color-mix(in srgb, var(--accent) 60%, transparent), inset 0 0 18px rgba(255,255,255,0.6);
    animation: breathe 3.4s ease-in-out infinite;
    transition: background 0.6s ease, box-shadow 0.6s ease;
  }

  /* ===== DURUM RENKLERİ ===== */
  /* kapalı (idle): soluk ve yavaş */
  body:not(.on-state) .jarvis { --accent: var(--idle); --accent-soft: #8fb6c6; }
  body:not(.on-state) .ticks,
  body:not(.on-state) .scan { animation-play-state: paused; }
  body:not(.on-state) .core { animation-duration: 6s; opacity: 0.85; }

  /* açık (dinliyor): parlak camgöbeği, hızlı */
  body.on-state .jarvis { --accent: #56e6ff; --accent-soft: #b9f4ff; }

  /* düşünüyor: mor */
  body.thinking .jarvis { --accent: var(--purple); --accent-soft: #ddc9ff; }
  body.thinking .scan { animation-duration: 1.6s; }

  /* konuşuyor: altın + canlı çekirdek */
  body.speaking .jarvis { --accent: var(--gold); --accent-soft: #fff0c0; }
  body.speaking .core { animation: talk 0.5s ease-in-out infinite; }
  body.speaking .scan { animation-duration: 2.4s; }

  /* aktifken genel hızlanma */
  body.on-state .ring-outer { animation-duration: 9s; }
  body.on-state .ring-inner { animation-duration: 4.5s; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes talk { 0%,100% { transform: scale(1); } 25% { transform: scale(1.18); } 60% { transform: scale(0.94); } }
  @keyframes hexpulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

  /* küçük sessize alma simgesi */
  .mute {
    position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); right: 18px;
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer; z-index: 5;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(150,210,235,0.25);
    color: #cfeefb; backdrop-filter: blur(4px); transition: all 0.2s;
  }
  .mute:active { transform: scale(0.9); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

     noktalama temizle. Hem komutlar hem anahtarlar bununla karşılaştırılır. */
  function norm(s){
    return String(s).toLocaleLowerCase("tr-TR")
      .replace(/ı/g,"i").replace(/İ/g,"i").replace(/ç/g,"c").replace(/ğ/g,"g")
      .replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u")

  // Levenshtein (yanlış duyulan kelimeleri yakalamak için)
  function lev(a,b){
    const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
    const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
    for(let j=0;j<=n;j++) d[0][j]=j;
    for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
      d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    return d[m][n];
  }

  function matchesWake(text){

    81:"sağanak",82:"şiddetli sağanak",85:"hafif kar sağanağı",86:"yoğun kar sağanağı",
    95:"gök gürültülü fırtına",96:"dolulu fırtına",99:"şiddetli dolulu fırtına"};

  /* ====================== DOM & State ====================== */
  const body = document.body;
  const jarvis = document.getElementById("jarvis");
  const muteBtn = document.getElementById("muteBtn");

  let recognition=null, listening=false, awake=false, muted=false;
  let awakeTimer=null, proactiveTimer=null, lastInteraction=Date.now();
  let isSpeaking=false, ttsPrimed=false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;

  /* görsel durumu süren minimal yardımcılar (yazı yok) */
  function setStatus(){ /* görsel durum CSS sınıflarıyla yönetiliyor */ }
  function addLog(){ /* arayüzde yazı gösterilmiyor */ }
  let liveText = { set textContent(_) {} };

  /* ====================== Ses tanıma ====================== */
  function buildRecognition() {
    const r = new SpeechRecognition();
    r.lang = LANG;
    r.continuous = !(isIOS || isSafari);
    r.interimResults = true;
    r.maxAlternatives = 5;   // daha fazla aday -> daha hassas yakalama
    r.onstart = () => { setStatus(awake?"komut":"dinleniyor","active"); };
    r.onresult = (event) => {
      if (isSpeaking) return;
      let finalText="", interim="";
      for (let i=event.resultIndex; i<event.results.length; i++) {
        const res = event.results[i];
        // tüm alternatifleri topla; en uzun/dolu olanı kullan, wake için hepsine bak
        let best = "";
        for (let k=0; k<res.length; k++) if (res[k].transcript.length > best.length) best = res[k].transcript;
        if (res.isFinal) finalText += best + " ";
        else interim += best + " ";
      }
      // Uyumadan önce: anlık (interim) sonuçta bile "Jarvis" geçerse hemen uyan
      if (!awake && interim && matchesWake(interim)) wake();
      if (finalText.trim()) handleSpeech(finalText.trim());
    };
    r.onerror = (e) => {
      if (e.error==="no-speech"||e.error==="aborted") return;
      if (e.error==="not-allowed"||e.error==="service-not-allowed") { stopListening(); return; }
    };
    r.onend = () => { if (listening && !isSpeaking) { try { r.start(); } catch(_){} } };
    return r;
  }
  function restartRecognition(){ if (listening && recognition) { try { recognition.start(); } catch(_){} } }

  /* ====================== Yönlendirme ====================== */
  function handleSpeech(text) {
    const lower = text.toLocaleLowerCase("tr-TR");
    lastInteraction = Date.now();
    if (!awake) {
      if (matchesWake(lower)) {
        wake();
        // "jarvis"ten sonraki kısmı komut olarak al (bulanık eşleşmeleri de kes)
        const after = stripWake(lower);
        if (after) route(after); else speak("Buyurun efendim.");
      }
      return;
    }
    route(stripWake(lower));
  }
  // Cümleden "jarvis" ve yakın varyasyonlarını ayıkla
  function stripWake(s){
    return s.split(/\s+/).filter(w => !(norm(w).length>=4 && lev(norm(w),"jarvis")<=2) && norm(w)!=="jarvis" && norm(w)!=="carvis").join(" ").trim();
  }
  function wake() { awake=true; resetAwakeTimer(); }
  function resetAwakeTimer() { clearTimeout(awakeTimer); awakeTimer=setTimeout(()=>{ awake=false; }, 20000); }

  function route(cmd) {
    resetAwakeTimer(); lastInteraction=Date.now();
    if (!cmd) { speak("Sizi dinliyorum efendim."); return; }
    const n = norm(cmd);                              // normalize edilmiş komut
    const has=(...w)=>w.some(x=>n.includes(norm(x))); // esnek, Türkçe-karakter bağımsız

    // --- Kişisel bilgi (isim hafızası) ---
    if (has("adımı kaydet","ismimi kaydet","benim adım","benim ismim","bana de ki","bana adımla")) { saveName(cmd); return; }
    if (has("adımı biliyor musun","adım ne","ismim ne","ben kimim")) { tellName(); return; }

    // --- Konum ---
    if (has("neredeyim","konumum nerede","konumumu söyle","ben neredeyim","neresideyim")) { tellLocation(); return; }

    // --- Hava durumu (konumsal & bölgesel) ---
    if (has("hava")) { handleWeather(cmd); return; }

    if (has("saat kaç","saat ne","saati söyle")) { speak("Saat şu an "+nowTime()+" efendim."); return; }
    if (has("günlerden ne","bugün ne","tarih","hangi gün","bugün hangi")) { speak("Bugün "+nowDate()+" efendim."); return; }
    if (has("not al","not et","kaydet","sunu yaz","not düş")) { addNote(cmd); return; }
    if (has("notlarım","notları oku","notları söyle","notlarımı")) { readNotes(); return; }
    if (has("notları sil","notları temizle","notlarımı sil")) { localStorage.removeItem("jarvis_notes"); speak("Tüm notlarınızı sildim efendim."); return; }
    if (has("hatırlat","alarm kur","zamanlayıcı","süre kur","dakika sonra","saat sonra")) { setReminder(cmd); return; }
    if (has("hesapla","kaç eder","kaç yapar","artı","eksi","kere","bölü","çarpı","topla","çıkar")) { doMath(cmd); return; }

    // Genişletilmiş bilgi veritabanı (normalize edilmiş eşleşme)
    const known = KNOWLEDGE.find(it => it.keys.some(k => n.includes(norm(k))));
    if (known) { speak(known.a); return; }

    if (has("merhaba","selam","hey","günaydın","iyi akşamlar","iyi günler")) { speak(greeting()); return; }
    if (has("adın ne","kimsin","sen kimsin","sen nesin")) { speak("Ben Jarvis efendim, kişisel yapay zeka asistanınız."); return; }
    if (has("neler yapabilir","yeteneklerin","ne yapabilirsin","yardım et","komutlar")) { listSkills(); return; }
    if (has("nasılsın","naber","ne haber")) { speak("Tüm sistemlerim optimal çalışıyor efendim, teşekkür ederim."); return; }
    if (has("teşekkür","sağol","sağ ol","eyvallah")) { speak("Rica ederim efendim, her zaman buradayım."); return; }
    if (has("şaka","espri","güldür","komik bir şey")) { speak(randomJoke()); return; }
    if (has("kapan","uyu","görüşürüz","kendini kapat","dinlemeyi durdur")) { speak("Uykuya geçiyorum efendim. Beni 'Jarvis' diyerek uyandırabilirsiniz."); awake=false; return; }

    // Açık uçlu her şey -> Wikipedia (canlı medya)
    askWikipedia(cmd);
  }

  /* ====================== Kişisel bilgi (isim) ====================== */
  function saveName(cmd){
    let name = cmd.replace(/adımı kaydet|ismimi kaydet|benim adım|benim ismim|bana de ki|olarak kaydet|adımla seslen|seslen|olsun/gi,"").trim();
    name = name.replace(/[^a-zçğıöşüA-ZÇĞİÖŞÜ\s]/g,"").trim().split(/\s+/)[0] || "";
    if(!name){ speak("Adınızı tam anlayamadım efendim, 'benim adım ...' şeklinde söyler misiniz?"); return; }
    name = name.charAt(0).toLocaleUpperCase("tr-TR")+name.slice(1);
    localStorage.setItem("jarvis_name", name);
    speak("Memnun oldum "+name+" Bey. Adınızı hafızama kaydettim efendim.");
  }
  function tellName(){
    const name=localStorage.getItem("jarvis_name");
    speak(name ? "Adınız "+name+" efendim." : "Henüz adınızı bilmiyorum efendim. 'Benim adım ...' diyerek bana öğretebilirsiniz.");
  }
  function userName(){ return localStorage.getItem("jarvis_name") || ""; }

  /* ====================== Wikipedia beyni ====================== */
  function cleanQuery(cmd) {
    return cmd.replace(/(nedir|kimdir|kim|ne demek|nerededir|nedendir|anlat|hakkında bilgi ver|hakkında|söyle|açıkla|bana)\??/g," ").replace(/\s+/g," ").trim();
  }
  function askWikipedia(cmd) {
    const q = cleanQuery(cmd);
    if (!q || q.length < 2) { speak("Bunu tam anlayamadım efendim, biraz daha açar mısınız?"); return; }
    body.classList.add("thinking");
    const searchUrl = "https://tr.wikipedia.org/w/api.php?action=opensearch&limit=1&namespace=0&format=json&origin=*&search="+encodeURIComponent(q);
    fetch(searchUrl).then(r=>r.json()).then(data=>{
      const title = data && data[1] && data[1][0];
      if (!title) throw new Error("notfound");
      return fetch("https://tr.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title));
    }).then(r=>r.json()).then(s=>{
      body.classList.remove("thinking");
      if (s && s.extract && !/olabilir:/.test(s.extract)) speak(firstSentences(s.extract,3));
      else speak("Bu konuda net bir bilgi bulamadım efendim, farklı kelimelerle dener misiniz?");
    }).catch(()=>{ body.classList.remove("thinking"); speak("Bu konuda bilgiye ulaşamadım efendim, bağlantınızı kontrol edin."); });
  }
  function firstSentences(text,n){ const p=text.replace(/\s+/g," ").match(/[^.!?]+[.!?]+/g); if(!p) return text; let o=p.slice(0,n).join(" ").trim(); if(o.length>360) o=o.slice(0,357)+"..."; return o; }

  /* ====================== KONUM (izinli, önbellekli) ======================
     getLocation: taze önbellek varsa onu kullanır; yoksa izin isteyip alır,
     sonra localStorage'a kaydeder. Böylece "konumumun havası" sorulduğunda
     hızlı yanıt verir. */
  function getLocation(onOk, onErr){
    const FRESH = 10*60*1000; // 10 dk
    if (lastCoords && (Date.now()-lastCoords.ts) < FRESH) { onOk(lastCoords.lat, lastCoords.lon); return; }
    if (!navigator.geolocation) { onErr && onErr("yok"); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>{
        lastCoords = { lat:pos.coords.latitude, lon:pos.coords.longitude, ts:Date.now() };
        try { localStorage.setItem("jarvis_coords", JSON.stringify(lastCoords)); } catch(_){}
        setGeoConsent(true);
        onOk(lastCoords.lat, lastCoords.lon);
      },
      err=>{ if(err.code===1) setGeoConsent(false); onErr && onErr(err.code===1?"izin":"hata"); },
      { timeout:10000, enableHighAccuracy:false, maximumAge: 5*60*1000 }
    );
  }
  // Koordinattan yer adı (ücretsiz, anahtarsız reverse geocode)
  function reverseGeocode(lat,lon){
    return fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+lat+"&longitude="+lon+"&localityLanguage=tr")
      .then(r=>r.json())
      .then(d=>{ const parts=[d.city||d.locality, d.principalSubdivision, d.countryName].filter(Boolean); return parts.join(", ")||null; })
      .catch(()=>null);
  }
  function tellLocation(){
    getLocation(
      (lat,lon)=>{ reverseGeocode(lat,lon).then(place=> speak(place ? "Şu an "+place+" konumundasınız efendim." : "Konumunuzu aldım fakat yer adını çözemedim efendim.")); },
      (why)=>{ if(why==="izin") speak("Konum iznini vermemişsiniz efendim. Lütfen tarayıcıdan konum erişimine izin verin."); else speak("Konumunuza ulaşamadım efendim."); }
    );
  }

  /* ====================== Hava durumu ====================== */
  function handleWeather(cmd) {
    const n = norm(cmd);
    const wantsMyLocation = /(konumum|buranin|burada|bulundugum|yerimde|neredeysem|su an)/.test(n) || !extractCity(cmd);
    const city = wantsMyLocation ? null : extractCity(cmd);

    if (city) {
      speak(city+" için hava durumunu kontrol ediyorum efendim.");
      geocode(city).then(loc=> loc ? fetchWeather(loc.latitude,loc.longitude,loc.name) : speak(city+" adında bir yer bulamadım efendim.")).catch(()=>speak("Hava durumu servisine ulaşamadım efendim."));
      return;
    }
    speak("Konumunuza göre hava durumunu kontrol ediyorum efendim.");
    getLocation(
      (lat,lon)=>{ reverseGeocode(lat,lon).then(place=> fetchWeather(lat,lon, place||"Konumunuz")); },
      (why)=>{ if(why==="izin") speak("Konum izni vermediniz efendim. İzin verirseniz konumunuzun havasını söyleyebilirim; ya da bir şehir adı söyleyin, örneğin 'İzmir hava durumu'."); else speak("Konumunuzu alamadım efendim, lütfen bir şehir söyleyin."); }
    );
  }
  function extractCity(cmd){ let c=cmd.replace(/hava durumu|hava nasıl|hava|nasıl|durumu|tahmin|bugün|yarın|için|de|da|te|ta/g," ").replace(/[^a-zçğıöşü\s]/gi," ").replace(/\s+/g," ").trim(); if(!c||c.length<3) return null; return c.split(" ").filter(w=>w.length>2).slice(-2).join(" ").trim()||null; }
  function geocode(name){ return fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(name)+"&count=1&language=tr&format=json").then(r=>r.json()).then(d=>(d&&d.results&&d.results.length)?{latitude:d.results[0].latitude,longitude:d.results[0].longitude,name:d.results[0].name+(d.results[0].admin1?", "+d.results[0].admin1:"")}:null); }
  function fetchWeather(lat,lon,label){
    const url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=2";
    fetch(url).then(r=>r.json()).then(d=>{
      if(!d||!d.current){ speak("Hava durumu verisini alamadım efendim."); return; }
      const c=d.current, desc=WEATHER_CODES[c.weather_code]||"değişken", temp=Math.round(c.temperature_2m), feels=Math.round(c.apparent_temperature), hum=c.relative_humidity_2m, wind=Math.round(c.wind_speed_10m);
      let msg=label+" için şu an hava "+desc+", sıcaklık "+temp+" derece";
      if(Math.abs(feels-temp)>=2) msg+=", hissedilen "+feels+" derece";
      msg+=" efendim. Nem yüzde "+hum+", rüzgar saatte "+wind+" kilometre.";
      if(d.daily&&d.daily.time&&d.daily.time.length>1){
        const tmax=Math.round(d.daily.temperature_2m_max[1]),tmin=Math.round(d.daily.temperature_2m_min[1]),tdesc=WEATHER_CODES[d.daily.weather_code[1]]||"değişken",rain=d.daily.precipitation_probability_max?d.daily.precipitation_probability_max[1]:null;
        msg+=" Yarın ise "+tdesc+", "+tmin+" ile "+tmax+" derece arası bekleniyor";
        if(rain!=null&&rain>=40) msg+=", yağış ihtimali yüzde "+rain+", şemsiye almanızı öneririm";
        msg+=".";
      }
      if(temp<=5) msg+=" Hava soğuk, kalın giyinin efendim.";
      else if(temp>=30) msg+=" Hava sıcak, bol su için efendim.";
      if([61,63,65,80,81,82,95,96,99].includes(c.weather_code)) msg+=" Dışarı çıkacaksanız şemsiye alın.";
      speak(msg);
    }).catch(()=>speak("Hava durumu servisine ulaşırken sorun oluştu efendim."));
  }

  /* ====================== Notlar / Hatırlatıcı / Hesap ====================== */
  function getNotes(){ try { return JSON.parse(localStorage.getItem("jarvis_notes")||"[]"); } catch { return []; } }
  function saveNotes(n){ localStorage.setItem("jarvis_notes", JSON.stringify(n)); }
  function addNote(cmd){ let note=cmd.replace(/not al|not et|kaydet|şunu yaz|ki|diye/g,"").trim(); if(!note){ speak("Ne not almamı istersiniz efendim?"); return; } const n=getNotes(); n.push({text:note,at:new Date().toLocaleString("tr-TR")}); saveNotes(n); speak("Not alındı efendim: "+note); }
  function readNotes(){ const n=getNotes(); if(!n.length){ speak("Kayıtlı notunuz yok efendim."); return; } speak(n.length+" notunuz var efendim. "+n.map((x,i)=>(i+1)+". "+x.text).join(". ")); }
  function setReminder(cmd){
    const m=cmd.match(/(\d+)\s*(saniye|dakika|dk|saat)/);
    if(!m){ speak("Ne kadar süre sonra hatırlatayım efendim?"); return; }
    let amount=parseInt(m[1],10); const unit=m[2]; let ms=amount*1000;
    if(unit.startsWith("dak")||unit==="dk") ms=amount*60000; else if(unit==="saat") ms=amount*3600000;
    let what=cmd.split(/hatırlat|alarm|zamanlayıcı/)[0].replace(/(\d+)\s*(saniye|dakika|dk|saat)\s*(sonra)?/,"").trim()||"hatırlatma";
    speak(amount+" "+unit+" sonra hatırlatacağım efendim: "+what);
    setTimeout(()=>{ speak("Hatırlatma zamanı geldi efendim: "+what); try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(_){} }, ms);
  }
  function doMath(cmd){
    let expr=cmd.replace(/hesapla|kaç eder|kaç yapar|kaçtır/g,"").replace(/artı|topla|toplam/g,"+").replace(/eksi|çıkar/g,"-").replace(/çarpı|kere|çarp/g,"*").replace(/bölü|böl/g,"/").replace(/[^0-9+\-*/.,()\s]/g,"").replace(/,/g,".").trim();
    if(!expr||!/[0-9]/.test(expr)){ speak("Hangi işlemi hesaplamamı istersiniz efendim?"); return; }
    try { if(!/^[0-9+\-*/.()\s]+$/.test(expr)) throw 0; const res=Function('"use strict";return ('+expr+')')(); if(typeof res!=="number"||!isFinite(res)) throw 0; speak("Sonuç "+(Math.round(res*1000)/1000)+" efendim."); }
    catch { speak("Bu işlemi hesaplayamadım efendim."); }
  }

  /* ====================== TTS (ofis erkeği / butler tonu) ====================== */
  let chosenVoice = null;
  function pickVoice(){
    if (!synth) return null;
    const all = synth.getVoices();
    const tr = all.filter(v => v.lang && v.lang.toLowerCase().startsWith("tr"));
    // 1) Türkçe erkek ses  2) Türkçe (kadın değilse)  3) herhangi Türkçe
    let v = tr.find(x => MALE_HINTS.test(x.name))
         || tr.find(x => !FEMALE_HINTS.test(x.name))
         || tr[0];
    // Türkçe ses yoksa: İngiliz erkek (butler havası) -> herhangi erkek -> ilk
    if (!v) v = all.find(x => /en-GB/i.test(x.lang) && MALE_HINTS.test(x.name))
              || all.find(x => MALE_HINTS.test(x.name))
              || all[0];
    chosenVoice = v || null;
    return chosenVoice;
  }
  function primeTTS(){ if(ttsPrimed||!synth) return; try{ const u=new SpeechSynthesisUtterance(""); u.volume=0; synth.speak(u); ttsPrimed=true; }catch(_){} }
  function speak(text){
    if(muted||!synth){ restartRecognition(); return; }
    synth.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=LANG; u.rate=VOICE.rate; u.pitch=VOICE.pitch;   // derin, ağırbaşlı ton
    const v=chosenVoice||pickVoice(); if(v) u.voice=v;
    u.onstart=()=>{ isSpeaking=true; body.classList.add("speaking"); };
    u.onend=()=>{ isSpeaking=false; body.classList.remove("speaking"); restartRecognition(); };
    u.onerror=()=>{ isSpeaking=false; body.classList.remove("speaking"); restartRecognition(); };
    if((isIOS||isSafari)&&recognition){ try{ recognition.stop(); }catch(_){} }
    synth.speak(u);
  }

  /* ====================== Yardımcılar ====================== */
  function nowTime(){ return new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}); }
  function nowDate(){ return new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
  function greeting(){ const h=new Date().getHours(); const p=h<6?"İyi geceler":h<12?"Günaydın":h<18?"İyi günler":"İyi akşamlar"; const nm=userName(); return p+(nm?" "+nm+" Bey":" efendim")+". Size nasıl yardımcı olabilirim?"; }
  function randomJoke(){ const j=["Bir yapay zeka neden denize gitmiş? Bulutlardan sıkıldığı için efendim.","Bilgisayar neden üşümüş? Pencerelerini açık bırakmış efendim.","Robot neden kahve içmez? Kısa devre yapmaktan korkar efendim."]; return j[Math.floor(Math.random()*j.length)]; }
  function listSkills(){ speak("Konumunuzun ve istediğiniz şehrin hava durumunu söyleyebilirim, neredeyseniz bulabilirim, adınızı hatırlayabilirim, not alıp okuyabilirim, hatırlatıcı kurabilirim, matematik yapabilir ve bilim, uzay, tarih, coğrafya gibi pek çok konuda bilgi verebilirim efendim. Bilmediğimi de Wikipedia'dan araştırıp özetlerim."); }

  /* ====================== Proaktif kontrol ====================== */
  function startProactive(){
    clearInterval(proactiveTimer);
    proactiveTimer=setInterval(()=>{
      if(!listening||muted) return;
      if(Date.now()-lastInteraction>4*60*1000){ const p=["Efendim, bir şeye ihtiyacınız var mı?","Buradayım efendim, yardımcı olabileceğim bir şey var mı?","Her şey yolunda mı efendim?"]; speak(p[Math.floor(Math.random()*p.length)]); lastInteraction=Date.now(); }
    }, 60*1000);
  }

  /* ====================== Başlat / Durdur (sembole dokun) ====================== */
  function startListening(){
    primeTTS();
    if(listening) return;
    if(!SpeechRecognition){ body.classList.add("on-state"); jarvis.classList.add("on"); speak("Sesli tanıma bu tarayıcıda yok efendim, fakat sesli yanıt verebilirim."); return; }
    listening=true; recognition=buildRecognition();
    try{ recognition.start(); }catch(_){}
    body.classList.add("on-state"); jarvis.classList.add("on");
    jarvis.setAttribute("aria-label","Jarvis dinliyor — durdurmak için dokun");
    lastInteraction=Date.now(); startProactive();

    const name = userName();
    const hello = "Sistemler çevrimiçi" + (name ? ", "+name+" Bey" : " efendim") + ". Sizi dinliyorum.";

    // İlk açılışta izinleri iste (mikrofon zaten istendi; şimdi konum)
    if (!localStorage.getItem("jarvis_onboarded")) {
      localStorage.setItem("jarvis_onboarded","1");
      speak(hello + " Size daha iyi hizmet edebilmem için konumunuza erişmek istiyorum; izin verirseniz bulunduğunuz yerin havasını anında söyleyebilirim.");
      // izin penceresini tetikle ve konumu önbelleğe al
      getLocation(()=>{}, ()=>{});
    } else {
      speak(hello);
      if (geoConsent() && !lastCoords) getLocation(()=>{}, ()=>{});  // sessizce tazele
    }
  }
  function stopListening(){
    listening=false; awake=false; clearTimeout(awakeTimer); clearInterval(proactiveTimer);
    if(recognition){ try{ recognition.stop(); }catch(_){} }
    if(synth) synth.cancel();
    body.classList.remove("on-state","speaking","thinking"); jarvis.classList.remove("on");
    jarvis.setAttribute("aria-label","Jarvis — başlatmak için dokun");
  }
  function toggle(){ listening ? stopListening() : startListening(); }

  jarvis.addEventListener("click", toggle);
  jarvis.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
  muteBtn.addEventListener("click", e=>{ e.stopPropagation(); muted=!muted; muteBtn.textContent=muted?"🔇":"🔊"; if(muted&&synth) synth.cancel(); });

  if(synth) synth.onvoiceschanged = pickVoice;
})();
</script>
</body>
</html>
