[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "0.1.0"
description = "Kişisel bilgi tabanı / ikinci beyin CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
]

[project.scripts]
cortex = "cortex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cortex*"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "black",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
