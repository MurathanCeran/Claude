<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Na'vi Dili — Mini Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cyan:#00d4ff;
  --teal:#00fff0;
  --green:#3dff7a;
  --glow:0 0 22px rgba(0,212,255,.5);
}
body{background:#020810;color:#c5e4f8;font-family:'Raleway',sans-serif;overflow-x:hidden}
#pandora-bg{position:fixed;inset:0;z-index:-2;overflow:hidden}
#pandora-bg svg{width:100%;height:100%;display:block}
#pc{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.45}

/* ── LANDING ── */
#landing{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:2rem 1.5rem;
}
.land-inner{max-width:520px}
.land-tag{
  display:inline-block;font-family:'Cinzel',serif;font-size:.7rem;
  letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);
  border:1px solid rgba(0,212,255,.3);padding:.32rem .95rem;
  border-radius:50px;margin-bottom:1.4rem;background:rgba(0,212,255,.07);
}
.land-title{
  font-family:'Cinzel',serif;font-size:clamp(2rem,6vw,3.6rem);
  line-height:1.1;color:#fff;
  text-shadow:0 0 40px rgba(0,212,255,.55),0 0 80px rgba(0,212,255,.2);
  margin-bottom:1rem;
}
.land-title span{color:var(--teal)}
.land-sub{color:#7ab8d8;font-size:1rem;line-height:1.7;margin-bottom:2rem}
.land-sub em{color:var(--cyan);font-style:italic}

/* ── BUTTONS ── */
.btn{display:inline-block;padding:.85rem 2.4rem;border-radius:50px;font-family:'Raleway',sans-serif;font-weight:600;font-size:.95rem;letter-spacing:.07em;cursor:pointer;border:none;transition:all .3s}
.btn-p{background:linear-gradient(135deg,#0077aa,var(--cyan));color:#fff;box-shadow:0 0 22px rgba(0,212,255,.45)}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 0 38px rgba(0,212,255,.7)}
.btn-o{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn-o:hover{background:rgba(0,212,255,.1);box-shadow:0 0 22px rgba(0,212,255,.35);transform:translateY(-2px)}

/* ── QUIZ OVERLAY ── */
#quiz-overlay{
  position:fixed;inset:0;z-index:950;display:none;
  flex-direction:column;align-items:center;overflow-y:auto;
  background:rgba(2,8,20,.96);backdrop-filter:blur(16px);
  opacity:0;transition:opacity .4s ease;
}
#quiz-overlay::before{content:'';position:fixed;inset:0;background:rgba(5,14,28,.88);pointer-events:none;z-index:0}
#quiz-overlay.visible{opacity:1}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.qov-hd{
  position:sticky;top:0;z-index:10;width:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:.9rem 2rem;background:rgba(2,8,22,.85);
  border-bottom:1px solid rgba(0,212,255,.14);backdrop-filter:blur(10px);
}
.qov-brand{font-family:'Cinzel',serif;font-size:.82rem;color:var(--teal);letter-spacing:.18em;text-transform:uppercase}
.qov-close{background:none;border:1px solid rgba(0,212,255,.3);color:#7ab8d8;padding:.42rem 1.1rem;border-radius:50px;cursor:pointer;font-size:.8rem;font-family:'Raleway',sans-serif;transition:all .2s}
.qov-close:hover{border-color:var(--teal);color:var(--teal)}
#qov-body{position:relative;z-index:2;width:100%;max-width:620px;padding:2.5rem 1.5rem 4rem}

/* name-gate */
#name-gate{text-align:center;padding:1rem 0}
.gate-title{font-family:'Cinzel',serif;font-size:1.7rem;color:#eef8ff;margin-bottom:.55rem}
.gate-sub{color:#7ab8d8;margin-bottom:1.8rem;font-size:.95rem;line-height:1.65}

/* question card */
#qcard{display:none}
.qpbar{background:rgba(0,212,255,.1);border-radius:50px;height:5px;margin-bottom:1.8rem;overflow:hidden}
.qpfill{height:100%;background:linear-gradient(90deg,#0070aa,var(--teal));border-radius:50px;transition:width .5s ease}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9rem}
.qnum{font-family:'Cinzel',serif;font-size:.78rem;color:var(--teal);letter-spacing:.1em}
.qcat{font-size:.75rem;color:#5090b0;background:rgba(0,212,255,.08);padding:.22rem .75rem;border-radius:20px}
.qtxt{font-family:'Cinzel',serif;font-size:1.15rem;color:#eef8ff;line-height:1.48;margin-bottom:1.6rem}
.qopts{display:flex;flex-direction:column;gap:.8rem}
.qopt{
  background:rgba(0,28,58,.65);border:1.5px solid rgba(0,212,255,.2);
  border-radius:12px;padding:.95rem 1.3rem;color:#9cd0e8;font-size:.93rem;
  cursor:pointer;text-align:left;font-family:'Raleway',sans-serif;transition:all .2s;
  animation:qSlideIn .35s ease both;
}
.qopt:hover:not(:disabled){border-color:var(--teal);background:rgba(0,212,255,.1);color:#e0f6ff;transform:translateX(4px)}
.qopt.correct{border-color:var(--green);background:rgba(61,255,122,.1);color:#b0f0c0}
.qopt.wrong{border-color:#ff4d6a;background:rgba(255,77,106,.1);color:#ffb0bc}
.qopt:disabled{cursor:default}
.qfb{margin-top:.9rem;padding:.75rem 1.1rem;border-radius:10px;font-size:.88rem;text-align:center;min-height:2.4rem}
.qfb.ok{background:rgba(61,255,122,.09);color:#90ff90}
.qfb.bad{background:rgba(255,77,106,.09);color:#ff99aa}
.qnav{margin-top:1.2rem;text-align:center}

/* result card */
#rcard{display:none;text-align:center}
.rscore-big{font-family:'Cinzel',serif;font-size:3.5rem;color:var(--teal);text-shadow:var(--glow);line-height:1;margin-bottom:.4rem;animation:scorePop .6s cubic-bezier(.2,1.4,.5,1) both}
@keyframes scorePop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.rscore-lbl{font-size:.85rem;color:#5090b0;margin-bottom:1.2rem}
.rtitle{font-family:'Cinzel',serif;font-size:1.35rem;color:#eef8ff;margin-bottom:.5rem}
.rsub{color:#7ab8d8;font-size:.9rem;margin:0 auto 1.4rem;line-height:1.6;max-width:400px}
.rsum{text-align:left;max-width:500px;margin:0 auto 1rem}
.rans{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem .85rem;border-radius:10px;margin-bottom:.38rem;font-size:.84rem;line-height:1.5;animation:qSlideIn .35s ease both}
.rans.ok{background:rgba(61,255,122,.07);color:#a8f0a0}
.rans.bad{background:rgba(255,77,106,.07);color:#ffb0bc}
.rans-ic{font-size:.92rem;flex-shrink:0;margin-top:.08rem}
.rbtns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1.4rem}

@keyframes qSlideIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  </style>
</head>

<canvas id="pc"></canvas>

<!-- ═══ LANDING ═══ -->
<div id="landing">
  <div class="land-inner">
    <div class="land-tag">Na'vi · Pandora · Avatar</div>
    <h1 class="land-title">Na'vi Dili<br/><span>Mini Test</span></h1>
    <p class="land-sub">10 soru — dil ve Avatar dünyası hakkında.<br/><em>"Oel ngati kameie"</em> — Seni görüyorum.</p>
    <button class="btn btn-p" onclick="openQuiz()">Teste Gir</button>
  </div>
</div>

<!-- ═══ QUIZ OVERLAY ═══ -->
<div id="quiz-overlay" role="dialog" aria-modal="true">
  <div class="qov-hd">
    <span class="qov-brand">Na'vi · Test Ekranı</span>
    <button class="qov-close" onclick="closeQuiz()">✕ Geri Dön</button>
  </div>
  <div id="qov-body">

    <div id="name-gate">
      <div class="gate-title">Na'vi · Mini Test</div>
      <p class="gate-sub">10 soru — Na'vi dili ve Avatar dünyası hakkında.<br/>Bakalım ne kadar biliyorsun!</p>
      <button class="btn btn-p" onclick="startQuiz()">Başla</button>
    </div>

    <div id="qcard">
      <div class="qpbar"><div class="qpfill" id="qpfill" style="width:0%"></div></div>
      <div class="qmeta">
        <span class="qnum" id="qnum"></span>
        <span class="qcat" id="qcat"></span>
      </div>
      <div class="qtxt" id="qtxt"></div>
      <div class="qopts" id="qopts"></div>
      <div class="qfb" id="qfb"></div>
      <div class="qnav">
        <button class="btn btn-p" id="nxtbtn" onclick="nextQ()" style="display:none">Sonraki →</button>
      </div>
    </div>

    <div id="rcard">
      <div class="rscore-big" id="rscore"></div>
      <div class="rscore-lbl" id="rtot"></div>
      <div class="rtitle" id="rtitle"></div>
      <div class="rsub" id="rsub"></div>
      <div class="rsum"><div id="rlist"></div></div>
      <div class="rbtns">
        <button class="btn btn-p" onclick="retryQ()">Tekrar Dene</button>
        <button class="btn btn-o" onclick="closeQuiz()">Geri Dön</button>
      </div>
    </div>

  </div>
</div>

<script>
/* ── PARTICLES ── */
(function(){
  const cv=document.getElementById('pc'),cx=cv.getContext('2d');
  let W,H,pts;
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  function mk(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.3,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,a:Math.random()*.5+.15,h:Math.random()>.6?195:270}}
  function init(){resize();pts=Array.from({length:120},mk)}
  function draw(){
    cx.clearRect(0,0,W,H);
    for(const p of pts){
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
      cx.fillStyle=`hsla(${p.h},100%,72%,${p.a})`;cx.fill();
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize',resize);init();draw();
})();

/* ── QUIZ ── */
const Qs=[
  {cat:"Na'vi Dili",q:"Na'vi dilinde 'Merhaba' nasıl denir?",opts:["Irayo","Kaltxì","Srane","Kehe"],ans:1},
  {cat:"Na'vi Dili",q:"Na'vi cümle yapısının temel kelime sırası nedir?",opts:["SVO","VSO","SOV","OVS"],ans:2},
  {cat:"Na'vi Dili",q:"'Oel ngati kameie' ne anlama gelir?",opts:["Seni seviyorum","Seni görüyorum — ruhunu","Teşekkür ederim","Hoş geldin"],ans:1},
  {cat:"Na'vi Dili",q:"Na'vi'de 'Teşekkür ederim' nasıl söylenir?",opts:["Kaltxì","Nìprrte'","Irayo","Eyawr"],ans:2},
  {cat:"Na'vi Dili",q:"Na'vi'de fiil çekimi nasıl yapılır?",opts:["Sona ek getirilir","Kelime ortasına infix eklenir","Yardımcı fiil kullanılır","Başa ön-ek getirilir"],ans:1},
  {cat:"Na'vi Dili",q:"Na'vi dilini gerçek hayatta kim yarattı?",opts:["James Cameron","Paul Frommer","Peter Jackson","Zoe Saldana"],ans:1},
  {cat:"Avatar Filmi",q:"Na'vi'lerin yaşadığı ay'ın adı nedir?",opts:["Proxima","Pandora","Eywa Prime","Helios"],ans:1},
  {cat:"Avatar Filmi",q:"Jake Sully filmde hangi efsanevi unvanı kazanır?",opts:["Olo'eyktan","Tsahìk","Toruk Makto","Tsamsiyu"],ans:2},
  {cat:"Avatar Filmi",q:"Na'vi'lerin nöral bağlantı organına ne denir?",opts:["Ikran","Tswin","Syaw","Tsyal"],ans:1},
  {cat:"Avatar Filmi",q:"Avatar 2'nin alt başlığı nedir?",opts:["The Spirit Tree","The Way of Water","Fire and Sky","Return to Pandora"],ans:1}
];

let cur=0,score=0,answrd=false,answers=[];

function openQuiz(){
  const ov=document.getElementById('quiz-overlay');
  ov.style.display='flex';
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('visible')));
  reset();
}
function closeQuiz(){
  const ov=document.getElementById('quiz-overlay');
  ov.classList.remove('visible');
  setTimeout(()=>{ov.style.display='none';document.body.style.overflow=''},420);
}
function reset(){
  cur=0;score=0;answrd=false;answers=[];
  document.getElementById('name-gate').style.display='block';
  document.getElementById('qcard').style.display='none';
  document.getElementById('rcard').style.display='none';
}
function startQuiz(){
  document.getElementById('name-gate').style.display='none';
  document.getElementById('qcard').style.display='block';
  renderQ();
}
function renderQ(){
  answrd=false;
  const q=Qs[cur];
  const card=document.getElementById('qcard');
  card.style.animation='none';
  requestAnimationFrame(()=>{card.style.animation='qSlideIn .35s ease'});
  document.getElementById('qnum').textContent=`Soru ${cur+1} / ${Qs.length}`;
  document.getElementById('qcat').textContent=q.cat;
  document.getElementById('qtxt').textContent=q.q;
  document.getElementById('qfb').textContent='';
  document.getElementById('qfb').className='qfb';
  document.getElementById('nxtbtn').style.display='none';
  document.getElementById('qpfill').style.width=(cur/Qs.length*100)+'%';
  const c=document.getElementById('qopts');c.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');b.className='qopt';b.textContent=o;
    b.style.animationDelay=(i*.07)+'s';
    b.onclick=()=>pick(i);c.appendChild(b);
  });
}
function pick(idx){
  if(answrd)return;answrd=true;
  const q=Qs[cur];
  const opts=document.querySelectorAll('.qopt');
  opts.forEach(b=>b.disabled=true);
  opts[q.ans].classList.add('correct');
  const ok=idx===q.ans;
  const fb=document.getElementById('qfb');
  if(ok){score++;opts[idx].classList.add('correct');fb.textContent='✓ Doğru! Eywa seninle!';fb.className='qfb ok'}
  else{opts[idx].classList.add('wrong');fb.textContent=`✗ Yanlış — doğrusu: "${q.opts[q.ans]}"`;fb.className='qfb bad'}
  answers.push({q:q.q,ok,correct:q.opts[q.ans]});
  document.getElementById('nxtbtn').style.display='inline-block';
}
function nextQ(){cur++;if(cur<Qs.length)renderQ();else showRes()}
function showRes(){
  document.getElementById('qcard').style.display='none';
  const rc=document.getElementById('rcard');
  rc.style.display='block';rc.style.animation='qSlideIn .4s ease';
  const total=Qs.length,pct=Math.round(score/total*100);
  document.getElementById('rscore').textContent=score;
  document.getElementById('rtot').textContent=`/ ${total} doğru`;
  const msgs=[
    [100,"Toruk Makto!","Mükemmel — tüm soruları doğru yanıtladın. Sen gerçek bir Na'vi'sin!"],
    [80, "Omatikaya Savaşçısı","Pandora'yı ve Na'vi dilini çok iyi biliyorsun."],
    [60, "Yetenekli Çırak","İyi başlangıç! Birkaç soruya daha bak."],
    [0,  "Pandora'ya İlk Adım","Merak etme — tekrar dene, ilk Na'vi herkes öğrenir!"]
  ];
  const [,t,s]=msgs.find(([p])=>pct>=p);
  document.getElementById('rtitle').textContent=t;
  document.getElementById('rsub').textContent=s;
  const list=document.getElementById('rlist');list.innerHTML='';
  answers.forEach((a,i)=>{
    const d=document.createElement('div');
    d.className='rans '+(a.ok?'ok':'bad');
    d.style.animationDelay=(i*.06)+'s';
    d.innerHTML=`<span class="rans-ic">${a.ok?'✓':'✗'}</span><div><strong>${i+1}.</strong> ${a.q}${!a.ok?`<br/><small>Doğrusu: <em>${a.correct}</em></small>`:''}</div>`;
    list.appendChild(d);
  });
}
function retryQ(){reset();startQuiz()}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('quiz-overlay').classList.contains('visible'))closeQuiz()});
</script>
